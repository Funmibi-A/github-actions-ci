
name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  APP_ENV: ci

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "No third-party dependencies required."
          fi

      - name: Build application
        run: python -m compileall -q app.py tests

      - name: Run automated tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results.txt
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_ENV=production \
            --tag ghcr.io/funmibi-a/github-actions-ci:${{ github.sha }} \
            .

      - name: Save Docker image
        run: |
          docker save \
            ghcr.io/funmibi-a/github-actions-ci:${{ github.sha }} \
            -o image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: image

      - name: Load Docker image
        run: docker load --input image/image.tar

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Publish Docker image
        run: |
          docker push ghcr.io/funmibi-a/github-actions-ci:${{ github.sha }}
          docker tag \
            ghcr.io/funmibi-a/github-actions-ci:${{ github.sha }} \
            ghcr.io/funmibi-a/github-actions-ci:latest
          docker push ghcr.io/funmibi-a/github-actions-ci:latest

